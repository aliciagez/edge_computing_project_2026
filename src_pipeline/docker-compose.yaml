services:
  consumer:
    container_name: consumer
    build:
      context: .
      dockerfile: dockerfiles/consumer.dockerfile
    env_file:
    - .env
    depends_on:
    - timescaledb
    - mosquitto

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto
    ports:
      - "1883:1883"

  timescaledb:
    image: timescale/timescaledb:latest-pg18
    container_name: timescaledb
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
     - "5432:5432"
    volumes:
     - timescale_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"] # ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"] <- kanske behöver byta till om det första inte fungerar
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      - timescaledb
    
volumes:
  timescale_data:
  grafana_data: